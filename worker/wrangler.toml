name = "vestidor-emiliano"
main = "vestidor.js"
compatibility_date = "2026-08-20"

[vars]
# Sólo estos orígenes reciben respuesta. Dejalo vacío y contesta a cualquiera.
ORIGENES = "https://emilianocobe.github.io,http://localhost:8123"
# Cuántas pruebas puede hacer un mismo visitante por día.
TOPE_DIARIO = "10"
# Techo del sitio entero por día, para que nadie te vacíe la cuenta.
TECHO_DIARIO = "60"

# El contador de pruebas. Creá el namespace y pegá su id acá:
#   npx wrangler kv namespace create CUPOS
[[kv_namespaces]]
binding = "CUPOS"
id = "PEGAR_ACA_EL_ID_QUE_TE_DEVUELVA_WRANGLER"
